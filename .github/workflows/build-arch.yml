name: Build Arch Package

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-arch:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm \
            git \
            base-devel \
            meson \
            ninja \
            gtk3 \
            vte3 \
            glib2

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "Project contents:"
          ls -la helwan-terminal

          echo "Checking PKGBUILD:"
          test -f PKGBUILD

      - name: Create non-root builder user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Arch package
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg -sf --noconfirm"

      - name: Collect package
        run: |
          mkdir -p pkg-output
          cp ./*.pkg.tar.zst pkg-output/
          ls -lh pkg-output

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: helwan-terminal-arch
          path: pkg-output/*.pkg.tar.zst
