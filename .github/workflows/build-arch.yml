name: Build Arch Package

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-arch:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm \
            git \
            base-devel \
            meson \
            ninja \
            gtk3 \
            vte3 \
            glib2

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare source tarball
        run: |
          mkdir -p /tmp/helwan-terminal-${{ env.PKGVER }}
          cp -r helwan-terminal/* /tmp/helwan-terminal-${{ env.PKGVER }}/
          cd /tmp
          tar --exclude='.git' --exclude='build' --exclude='*.pkg.tar.zst' \
              -czf helwan-terminal-${{ env.PKGVER }}.tar.gz helwan-terminal-${{ env.PKGVER }}
          mv helwan-terminal-${{ env.PKGVER }}.tar.gz $GITHUB_WORKSPACE/

      - name: Create non-root user and build package
        run: |
          useradd -m builder
          passwd -d builder
          chown -R builder:builder .
          su builder -c "cd helwan-terminal && makepkg -sf --noconfirm"

      - name: Collect package
        run: |
          mkdir -p pkg-output
          cp helwan-terminal/*.pkg.tar.zst pkg-output/
          ls -lh pkg-output

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: helwan-terminal-arch
          path: pkg-output/*.pkg.tar.zst
