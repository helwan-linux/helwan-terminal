```yaml
name: CleanupActions

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    name: Delete Runs, Artifacts and Caches
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup all workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "=========================================="
          echo "Cleaning GitHub Actions"
          echo "Repository: $REPO"
          echo "=========================================="

          echo ""
          echo "Deleting workflow runs..."

          gh run list \
            --repo "$REPO" \
            --limit 1000 \
            --json databaseId \
            --jq '.[].databaseId' |
          while read -r RUN_ID; do
            if [ -n "$RUN_ID" ]; then
              echo "Deleting run: $RUN_ID"
              gh run delete "$RUN_ID" --repo "$REPO" || true
            fi
          done

          echo ""
          echo "Deleting artifacts..."

          gh api \
            --paginate \
            --method GET \
            "/repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
          while read -r ARTIFACT_ID; do
            if [ -n "$ARTIFACT_ID" ]; then
              echo "Deleting artifact: $ARTIFACT_ID"
              gh api \
                --method DELETE \
                "/repos/$REPO/actions/artifacts/$ARTIFACT_ID" || true
            fi
          done

          echo ""
          echo "Deleting Actions caches..."

          gh extension install actions/gh-actions-cache 2>/dev/null || true

          gh actions-cache delete-all \
            --confirm \
            --repo "$REPO" || true

          echo ""
          echo "=========================================="
          echo "Cleanup completed."
          echo "=========================================="
          echo ""
          echo "NOTE:"
          echo "- Workflow runs were deleted."
          echo "- Artifacts were deleted."
          echo "- Actions caches were deleted."
          echo "- Runner temporary storage is automatically discarded."
          echo "- Delete this cleanup workflow manually."
          echo "- Delete other workflow files manually."
          echo "=========================================="
```
