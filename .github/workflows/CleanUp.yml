```yaml
name: Cleanup GitHub Actions

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    name: Cleanup Runs, Artifacts and Caches
    runs-on: ubuntu-latest

    steps:
      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -e

          echo "Deleting workflow runs..."

          while true; do
            RUN_IDS=$(gh api \
              --method GET \
              "/repos/${REPO}/actions/runs?per_page=100" \
              --jq '.workflow_runs[].id')

            if [ -z "$RUN_IDS" ]; then
              echo "No more workflow runs found."
              break
            fi

            while read -r RUN_ID; do
              if [ -n "$RUN_ID" ]; then
                echo "Deleting workflow run: $RUN_ID"

                gh api \
                  --method DELETE \
                  "/repos/${REPO}/actions/runs/${RUN_ID}" \
                  || true
              fi
            done <<< "$RUN_IDS"

            sleep 2
          done

      - name: Delete all artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -e

          echo "Deleting artifacts..."

          while true; do
            ARTIFACT_IDS=$(gh api \
              --method GET \
              "/repos/${REPO}/actions/artifacts?per_page=100" \
              --jq '.artifacts[].id')

            if [ -z "$ARTIFACT_IDS" ]; then
              echo "No more artifacts found."
              break
            fi

            while read -r ARTIFACT_ID; do
              if [ -n "$ARTIFACT_ID" ]; then
                echo "Deleting artifact: $ARTIFACT_ID"

                gh api \
                  --method DELETE \
                  "/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}" \
                  || true
              fi
            done <<< "$ARTIFACT_IDS"

            sleep 2
          done

      - name: Delete all Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -e

          echo "Deleting Actions caches..."

          while true; do
            CACHE_IDS=$(gh api \
              --method GET \
              "/repos/${REPO}/actions/caches?per_page=100" \
              --jq '.actions_caches[].id')

            if [ -z "$CACHE_IDS" ]; then
              echo "No more caches found."
              break
            fi

            while read -r CACHE_ID; do
              if [ -n "$CACHE_ID" ]; then
                echo "Deleting cache: $CACHE_ID"

                gh api \
                  --method DELETE \
                  "/repos/${REPO}/actions/caches/${CACHE_ID}" \
                  || true
              fi
            done <<< "$CACHE_IDS"

            sleep 2
          done

      - name: Cleanup summary
        run: |
          echo "=========================================="
          echo "GitHub Actions cleanup completed."
          echo "=========================================="
          echo ""
          echo "Deleted:"
          echo "- Workflow runs"
          echo "- Artifacts"
          echo "- Actions caches"
          echo ""
          echo "The repository files were NOT modified."
          echo "No git commit was created."
          echo "No git push was performed."
          echo ""
          echo "You can now delete this workflow manually."
```
