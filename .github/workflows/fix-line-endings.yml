name: Fix All Project Line Endings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-line-endings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config core.autocrlf false
          git config core.eol lf

      - name: Convert all text files to LF
        run: |
          find . -type f \
            ! -path './.git/*' \
            ! -iname '*.png' \
            ! -iname '*.jpg' \
            ! -iname '*.jpeg' \
            ! -iname '*.gif' \
            ! -iname '*.webp' \
            ! -iname '*.bmp' \
            ! -iname '*.ico' \
            -exec sed -i 's/\r$//' {} +

      - name: Configure line endings permanently
        run: |
          cat > .gitattributes <<'EOF'
          * text=auto eol=lf
          *.sh text eol=lf
          EOF

      - name: Show changed files
        run: |
          git add -A
          echo "Changed files:"
          git diff --cached --name-only

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Normalize all project files to LF"
            git push
          fi
